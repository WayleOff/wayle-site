<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Espace admin – Wayle</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#150E22">
<style>
:root{--bg:#150E22;--panel:#201733;--panel2:#2A1F42;--line:#3A2D56;--ink:#F3EFF8;--mid:#B3A8C7;--accent:#FF7A4D;--viol:#B9A2FF;--ok:#5ED08F;--err:#FF8A75;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
a{color:var(--viol)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--viol);outline-offset:2px}
.app{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:100vh}
aside.side{background:#100A1C;border-right:1px solid var(--line);padding:1.2rem .9rem;position:sticky;top:0;height:100vh;overflow:auto}
.brand{font:800 1.5rem/1 "Bricolage Grotesque",system-ui,sans-serif;letter-spacing:-.03em;margin:.2rem .5rem 1.2rem}
.brand b{color:var(--accent)}
.brand small{display:block;font:500 .72rem/1.2 system-ui;color:var(--mid);letter-spacing:.06em;text-transform:uppercase;margin-top:.35rem}
.side nav a{display:flex;align-items:center;gap:.6rem;padding:.6rem .7rem;border-radius:10px;color:var(--mid);text-decoration:none;font-weight:500}
.side nav a:hover{background:var(--panel);color:var(--ink)}
.side nav a.nav-edit{background:#FF7A4D;color:#150E22;font-weight:700;margin-bottom:.4rem}.side nav a.nav-edit:hover{background:#ff8f68;color:#150E22}
.side nav a[aria-current="page"]{background:var(--panel2);color:var(--ink)}
.side .ext{margin-top:1.2rem;border-top:1px solid var(--line);padding-top:.9rem}
.side .ext a{font-size:.9rem}
main{padding:1.6rem clamp(1rem,3vw,2.5rem) 5rem;max-width:1100px;width:100%}
h1{font:800 1.9rem/1.15 "Bricolage Grotesque",system-ui,sans-serif;letter-spacing:-.02em;margin:0 0 .35rem}
h2{font-size:1.1rem;margin:1.8rem 0 .7rem}
.sub{color:var(--mid);margin:0 0 1.4rem;max-width:44rem}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:1.1rem 1.2rem;margin-bottom:1rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:.9rem}
.tile{display:block;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:1rem 1.1rem;color:var(--ink);text-decoration:none}
.tile:hover{border-color:var(--viol);background:var(--panel2)}
.tile b{display:block;margin-bottom:.15rem}.tile span{color:var(--mid);font-size:.9rem}
.btn{display:inline-flex;align-items:center;gap:.4rem;background:var(--ink);color:#150E22;border:0;border-radius:999px;padding:.55rem 1.1rem;font-weight:600;cursor:pointer;text-decoration:none}
.btn:hover{opacity:.9}.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.ghost{background:none;color:var(--ink);border:1px solid var(--line)}.btn.ghost:hover{border-color:var(--ink)}
.btn.sm{padding:.32rem .75rem;font-size:.85rem}
.btn.danger{background:none;color:var(--err);border:1px solid #5a3030}
.row{display:flex;gap:.7rem;align-items:center;flex-wrap:wrap}
label.f{display:grid;gap:.3rem;font-weight:600;font-size:.88rem;color:var(--mid)}
input[type=text],input[type=url],select,textarea{width:100%;background:#150E22;border:1px solid var(--line);border-radius:10px;padding:.55rem .7rem;color:var(--ink)}
textarea{min-height:5.5rem;resize:vertical;line-height:1.45}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--viol)}
.hint{color:var(--mid);font-size:.82rem;font-weight:400}
.badge{display:inline-block;font-size:.72rem;font-weight:700;padding:.12rem .5rem;border-radius:999px;background:var(--panel2);color:var(--mid)}
.badge.on{background:#1d4a33;color:var(--ok)}.badge.mod{background:#4a3a1d;color:#FFC36B}
.bar{position:sticky;top:0;z-index:5;display:flex;gap:.7rem;align-items:center;justify-content:space-between;background:rgba(21,14,34,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:.7rem 0;margin:0 0 1rem}
body.lv-open{overflow:hidden}
#live{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;background:#0e0818;color:#fff}
#live .lv-bar{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;padding:.6rem 1rem;background:#1a1030;border-bottom:1px solid rgba(255,255,255,.18)}
#live .lv-f{display:flex;align-items:center;gap:.4rem;font-size:.9rem}
#live .lv-f select{font:inherit;color:#fff;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.3);border-radius:10px;padding:.3rem .5rem}
#live .lv-f select option{color:#150E22}
#live .lv-sw{display:flex;gap:.3rem}
#live .lv-sw button[aria-pressed=true]{background:#fff;color:#150E22}
#live .lv-m{order:99;flex:0 0 100%;min-width:0;font-size:.78rem;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:-.2rem}
#live .lv-bar .btn.sm{padding:.4rem .65rem;font-size:.84rem}
#live .lv-bar #lv-u{margin-left:auto}
#live .btn[disabled]{opacity:.45;cursor:default}
#live .lv-w{flex:1;min-height:0;display:flex;justify-content:center;background:#0e0818}
#live iframe{width:100%;height:100%;border:0;background:#fff}
#live.lv-tab iframe{width:820px;max-width:100%;border-left:1px solid rgba(255,255,255,.2);border-right:1px solid rgba(255,255,255,.2)}
#live.lv-mob iframe{width:390px;max-width:100%;border-left:1px solid rgba(255,255,255,.2);border-right:1px solid rgba(255,255,255,.2)}
.toast{position:fixed;left:50%;bottom:1.4rem;transform:translateX(-50%);z-index:50;background:#fff;color:#150E22;padding:.7rem 1.2rem;border-radius:999px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.toast.err{background:var(--err)}
.colors{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:1rem}
.colorf{display:grid;gap:.4rem}
.colorf .row input[type=color]{width:3rem;height:2.4rem;padding:0;border:1px solid var(--line);border-radius:10px;background:none;cursor:pointer}
.prev{height:170px;border-radius:16px;border:1px solid var(--line);display:flex;align-items:flex-end;padding:1rem;gap:.7rem;margin-top:1rem}
.prev .b1{background:#fff;color:#1E1038;border-radius:999px;padding:.5rem 1rem;font-weight:700}
.prev .b2{border:1.5px solid #fff;color:#fff;border-radius:999px;padding:.5rem 1rem;font-weight:600}
.fav{width:64px;height:64px;border-radius:14px;border:1px solid var(--line);background:#fff;object-fit:contain}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:.65rem .5rem;border-bottom:1px solid var(--line);vertical-align:middle}
th{color:var(--mid);font-size:.8rem;text-transform:uppercase;letter-spacing:.05em}
.txt-item{padding:.8rem 0;border-bottom:1px solid var(--line)}
.txt-item .k{font-size:.75rem;color:var(--mid);font-family:ui-monospace,monospace}
.txt-item textarea{min-height:2.6rem;margin-top:.3rem}
.sec-t{margin:1.6rem 0 .2rem;font-weight:700;color:var(--viol)}
.blk{background:var(--panel);border:1px solid var(--line);border-radius:16px;margin-bottom:.8rem}
.blk>.hd{display:flex;gap:.5rem;align-items:center;justify-content:space-between;padding:.6rem .9rem;border-bottom:1px solid var(--line)}
.blk>.hd b{font-size:.92rem}.blk>.bd{padding:.9rem;display:grid;gap:.8rem}
.mini{display:flex;gap:.25rem}
.mini button{background:none;border:1px solid var(--line);border-radius:8px;width:2rem;height:2rem;cursor:pointer;color:var(--mid)}
.mini button:hover:not(:disabled){color:var(--ink);border-color:var(--ink)}.mini button:disabled{opacity:.3;cursor:default}
.addbar{display:flex;gap:.5rem;flex-wrap:wrap;margin:.4rem 0 1rem}
.item{border:1px dashed var(--line);border-radius:12px;padding:.8rem;display:grid;gap:.6rem}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:.8rem}
.thumb{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:grid}
.thumb img{width:100%;aspect-ratio:1;object-fit:cover;background:#fff2}
.thumb .t{padding:.5rem .6rem;font-size:.8rem;color:var(--mid);display:grid;gap:.4rem}
.pick{cursor:pointer}.pick:hover{border-color:var(--viol)}
dialog{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:18px;max-width:760px;width:calc(100% - 2rem);padding:1.2rem}
dialog::backdrop{background:rgba(0,0,0,.6)}
.empty{color:var(--mid);padding:1.5rem;text-align:center;border:1px dashed var(--line);border-radius:14px}
.warn{background:#3a2a14;border:1px solid #6a4b1d;color:#FFD9A0;border-radius:12px;padding:.8rem 1rem;margin-bottom:1rem}
main.wide{max-width:none;padding:0}
@media (max-width:820px){.app{grid-template-columns:1fr}aside.side{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line)}.side nav{display:flex;flex-wrap:wrap;gap:.2rem}.side .ext{display:none}}
.blk.off{opacity:.55}
details.sub{margin:.6rem 0;border:1px dashed var(--line);border-radius:10px;padding:.5rem .8rem}
details.sub>summary,details.bd>summary{cursor:pointer;font-weight:600}
details.bd>summary{margin:.2rem 0 .6rem}
#live .lv-hist{list-style:none;margin:.6rem 0 0;padding:0;display:grid;gap:.5rem}#live .lv-hist li{display:flex;justify-content:space-between;align-items:center;gap:.6rem;padding:.55rem .7rem;border:1px solid rgba(255,255,255,.18);border-radius:10px}#live .lv-hist small{display:block;opacity:.7}
#live .lv-serp{margin:.6rem 0 .8rem;padding:.7rem .85rem;border-radius:12px;background:#fff;color:#202124;font-family:Arial,sans-serif}
#live .lv-serp-t{color:#1a0dab;font-size:1.05rem;line-height:1.3;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
#live .lv-serp-u{color:#188038;font-size:.78rem;margin:.1rem 0}#live .lv-serp-d{color:#4d5156;font-size:.84rem;line-height:1.45;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}
#live .lv-search{width:100%;margin:.7rem 0 .2rem;padding:.55rem .75rem;border-radius:10px;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.06);color:inherit;font:inherit}
#live .lv-gh,#dlg .lv-gh{margin:1rem 0 .4rem;font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;opacity:.7}
.lv-lib{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.55rem}
.lv-card{display:grid;gap:.25rem;align-content:start;text-align:left;font:inherit;color:inherit;padding:.5rem;border:1px solid rgba(255,255,255,.18);border-radius:12px;background:rgba(255,255,255,.04);cursor:pointer;transition:border-color .15s,transform .15s}
.lv-card:hover,.lv-card:focus-visible{border-color:#FF7A4D;transform:translateY(-2px)}
.lv-card b{font-size:.86rem}.lv-card small{opacity:.7;font-size:.74rem;line-height:1.3}
.lv-th{display:flex;gap:2px;border-radius:8px;background:rgba(255,255,255,.07);padding:4px;color:#e9e3f5}.lv-th i{flex:1;min-width:0}.lv-th.tp{flex-wrap:wrap}.lv-th.tp i{flex:0 0 calc(50% - 1px)}.lv-th svg{display:block;width:100%;height:auto}
#live .lv-main{flex:1;min-height:0;display:flex}
#live .lv-w{flex:1;min-width:0}
#live .lv-side{width:360px;flex:none;overflow:auto;padding:1rem;background:#1a1030;border-left:1px solid rgba(255,255,255,.18)}
#live .lv-side h3{font-size:1.05rem}
#live .lv-plan{list-style:none;margin:.6rem 0 1rem;padding:0;display:grid;gap:4px}
#live .lv-plan li{display:grid;grid-template-columns:auto 1fr auto;column-gap:.5rem;align-items:center;padding:.5rem .6rem;border:1px solid var(--line);border-radius:10px;background:var(--panel);cursor:pointer}
#live .lv-plan li small{grid-column:2;color:var(--mid);font-size:.8rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#live .lv-plan li.fixed{grid-template-columns:1fr;opacity:.8}
#live .lv-plan li.on{border-color:var(--accent)}
#live .lv-plan li.drag{opacity:.4}
#live .lv-plan li.ov-b{box-shadow:0 -3px 0 var(--accent)}
#live .lv-plan li.ov-a{box-shadow:0 3px 0 var(--accent)}
#live .lv-plan .hd{cursor:grab;color:var(--mid);grid-row:span 2}
#live .lv-types{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.8rem}
#live .lv-side .item{margin:.5rem 0}
#live.lv-mob .lv-w iframe{width:390px}#live.lv-tab .lv-w iframe{width:820px}
@media (max-width:900px){#live .lv-side{width:300px}}
</style></head>
<body>
<div class="app">
<aside class="side">
  <div class="brand">wayle<b>.</b><small>Espace admin</small></div>
  <nav id="nav" aria-label="Sections">
    <a href="#modifier" class="nav-edit">✎ Modifier le site</a>
    <a href="#accueil">Accueil</a>
    <a href="#principales">Pages principales</a>
    <a href="#theme">Thème</a>
    <a href="#apparence">Apparence</a>
    <a href="#textes">Textes du site</a>
    <a href="#pages">Pages</a>
    <a href="#medias">Images</a>
    <a href="#clients">Espaces clients <span id="nbadge" class="badge mod" hidden></span></a>
    <a href="#sauvegarde">Sauvegarde</a>
  </nav>
  <div class="ext nav-ext"><a href="/" target="_blank" rel="noopener">Voir le site ↗</a><br><a href="/gestion">Gestion de l’entreprise</a></div>
</aside>
<main id="main"><p class="sub">Chargement…</p></main>
</div>
<dialog id="dlg"></dialog>
<script>
(function(){
"use strict";
var $=function(s,r){return(r||document).querySelector(s)},$$=function(s,r){return[].slice.call((r||document).querySelectorAll(s))};
var esc=function(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")};
var norm=function(s){return String(s||"").replace(/\s+/g," ").trim()};
var DEF={primary:"#E8501E",secondary:"#6A2BD0",base:"#1E1038"};
var S={portals:{},acts:{},cfg:{},content:{items:{}},pages:{},media:[],dirty:false,edit:null,texts:null,textPage:"/",tSearch:"",from:null};
/* repère local (aucune donnée) : le site affiche « Modifier cette page » seulement si ce navigateur a déjà ouvert l'admin */
try{localStorage.setItem("wayle-admin","1")}catch(e){}

/* ---------- API ---------- */
function api(m,qs,b){
  var o={method:m,credentials:"same-origin",headers:{"X-Wayle":"1"}};
  if(b!==undefined){o.headers["Content-Type"]="application/json";o.body=JSON.stringify(b)}
  return fetch("/api/admin?"+qs,o).then(function(r){
    if(!r.ok){var e=new Error("http "+r.status);e.status=r.status;throw e}
    return r.json();
  });
}
function toast(t,err){var d=document.createElement("div");d.className="toast"+(err?" err":"");d.setAttribute("role","status");d.textContent=t;document.body.appendChild(d);setTimeout(function(){d.remove()},err?5000:2600)}
function fail(e){toast(e&&e.status===401?"Session expirée : rechargez la page.":e&&e.status===413?"Fichier trop lourd.":"Erreur d’enregistrement ("+(e&&e.message||"?")+")",true)}
function setDirty(v){S.dirty=!!v;var b=$("#savebtn");if(b)b.disabled=!v;var s=$("#dirty");if(s)s.textContent=v?"Modifications non enregistrées":""}
window.addEventListener("beforeunload",function(e){if(S.dirty||(L&&L.dirty)){e.preventDefault();e.returnValue=""}});

/* ---------- chargement ---------- */
function loadAll(){
  return Promise.all([api("GET","c=s_config&id=main"),api("GET","c=s_content&id=main"),api("GET","c=s_pages"),api("GET","c=s_media"),api("GET","c=c_portal"),api("GET","c=c_activity")]).then(function(r){
    S.cfg=r[0].data||{};S.content=r[1].data||{items:{}};if(!S.content.items)S.content.items={};
    S.pages={};r[2].forEach(function(p){S.pages[p.id]=p.data});
    S.portals={};r[4].forEach(function(p){S.portals[p.id]=p.data});S.acts={};r[5].forEach(function(p){S.acts[p.id]=p.data});
    S.media=r[3].map(function(m){return{id:m.id,d:m.data}}).sort(function(a,b){return(b.d.at||0)-(a.d.at||0)});
  });
}

/* ---------- navigation ---------- */
var VIEWS={modifier:vModifier,principales:vMainPages,"page-accueil":function(){location.replace("#principales/accueil")},accueil:vHome,theme:vTheme,apparence:vLook,textes:vTexts,pages:vPages,medias:vMedia,clients:vClients,sauvegarde:vBackup};
function route(){
  if(S.dirty&&!confirm("Vous avez des modifications non enregistrées. Quitter quand même ?")){history.replaceState(null,"",S.hash||"#accueil");return}
  if(S.unmount){S.unmount();S.unmount=null}
  var h=(location.hash||"#accueil").slice(1),seg=h.split("/"),v=seg[0];
  if(!VIEWS[v]){v="accueil";seg=[v]}
  S.hash="#"+h;setDirty(false);
  $$("#nav a").forEach(function(a){if(a.getAttribute("href")==="#"+v)a.setAttribute("aria-current","page");else a.removeAttribute("aria-current")});
  VIEWS[v](seg.slice(1));window.scrollTo(0,0);
  var nb=$("#nbadge");if(nb){var n=totalNew();nb.hidden=!n;nb.textContent=n}
}
window.addEventListener("hashchange",route);
function main(h){$("#main").innerHTML=h}
function head(title,sub,save){
  return '<div class="bar"><div><h1>'+title+'</h1></div><div class="row"><span id="dirty" class="hint"></span>'+(save?'<button class="btn" id="savebtn" type="button" disabled>Enregistrer</button>':'')+'</div></div>'+(sub?'<p class="sub">'+sub+'</p>':'');
}
document.addEventListener("keydown",function(e){if((e.ctrlKey||e.metaKey)&&e.key==="s"){var b=$("#savebtn");if(b){e.preventDefault();if(!b.disabled)b.click()}}});

/* ---------- Accueil ---------- */
function vHome(){
  var nm=Object.keys(S.content.items).length,np=Object.keys(S.pages).length,pub=Object.keys(S.pages).filter(function(k){return S.pages[k].published}).length;
  main(head("Bonjour Jonas",'Ici, vous modifiez votre site vous-même : couleurs, textes, pages, images. Les changements apparaissent sur le site en quelques secondes.')
   +'<div class="grid">'
   +'<a class="tile" href="#theme"><b>Thème</b><span>Couleurs, polices, formes, aperçu en direct</span></a>'
   +'<a class="tile" href="#apparence"><b>Apparence</b><span>Favicon</span></a>'
   +'<a class="tile" href="#principales"><b>Pages principales</b><span>Accueil, Artistes, Entreprises, Commerces</span></a>'
   +'<a class="tile" href="#textes"><b>Textes du site</b><span>'+nm+' texte'+(nm>1?"s":"")+' personnalisé'+(nm>1?"s":"")+'</span></a>'
   +'<a class="tile" href="#pages"><b>Pages</b><span>'+np+' page'+(np>1?"s":"")+' créée'+(np>1?"s":"")+', '+pub+' publiée'+(pub>1?"s":"")+'</span></a>'
   +'<a class="tile" href="#medias"><b>Images</b><span>'+imgs().length+' image'+(imgs().length>1?"s":"")+'</span></a>'
   +'</div><h2>Vos autres espaces</h2><div class="grid">'
   +'<a class="tile" href="/gestion"><b>Gestion de l’entreprise</b><span>Clients, projets, prospection, documents</span></a>'
   +'<a class="tile" href="#clients"><b>Espaces clients</b><span>'+Object.keys(S.portals).length+' espace'+(Object.keys(S.portals).length>1?"s":"")+(totalNew()?' · <b>'+totalNew()+' nouveauté'+(totalNew()>1?"s":"")+'</b>':'')+'</span></a>'
   +'<a class="tile" href="/" target="_blank" rel="noopener"><b>Voir le site</b><span>Ouvre wayle.fr dans un nouvel onglet</span></a>'
   +'</div><h2>Raccourcis</h2><div class="grid">'
   +'<a class="tile" href="https://calendly.com/waylecorp/appel-decouverte" target="_blank" rel="noopener"><b>Calendly</b><span>Vos rendez-vous d’appel découverte</span></a>'
   +'<a class="tile" href="https://web3forms.com/" target="_blank" rel="noopener"><b>Formulaire de contact</b><span>Web3Forms : les messages reçus</span></a>'
   +'<a class="tile" href="https://dash.cloudflare.com/" target="_blank" rel="noopener"><b>Cloudflare</b><span>Domaine, accès, déploiements</span></a>'
   +'<a class="tile" href="https://github.com/WayleOff/wayle-site" target="_blank" rel="noopener"><b>GitHub</b><span>Les fichiers du site</span></a>'
   +'<a class="tile" href="https://www.ovh.com/manager/" target="_blank" rel="noopener"><b>OVH</b><span>Nom de domaine et e-mails</span></a>'
   +'</div>');
}

/* ---------- Apparence ---------- */
function hex(h){h=String(h||"").replace("#","");if(!/^[0-9a-f]{6}$/i.test(h))return null;return[parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]}
function mixc(a,b,t){return[0,1,2].map(function(i){return Math.round(a[i]+(b[i]-a[i])*t)})}

function imgToBlob(file,max,square,type){
  return new Promise(function(res,rej){
    var u=URL.createObjectURL(file),im=new Image();
    im.onload=function(){
      var w=im.naturalWidth,h=im.naturalHeight,sx=0,sy=0,sw=w,sh=h,cw,ch;
      if(square){var m=Math.min(w,h);sx=(w-m)/2;sy=(h-m)/2;sw=sh=m;cw=ch=Math.min(max,m)}
      else{var k=Math.min(1,max/Math.max(w,h));cw=Math.round(w*k);ch=Math.round(h*k)}
      var cv=document.createElement("canvas");cv.width=cw;cv.height=ch;var x=cv.getContext("2d");x.drawImage(im,sx,sy,sw,sh,0,0,cw,ch);URL.revokeObjectURL(u);
      var q=.86,t=type||(file.type==="image/png"?"image/png":"image/webp");
      (function go(){cv.toBlob(function(b){
        if(!b){rej(new Error("image"));return}
        if(b.size>1000000&&q>.4&&t!=="image/png"){q-=.14;go();return}
        if(b.size>1000000&&t==="image/png"){t="image/webp";q=.8;go();return}
        res({blob:b,w:cw,h:ch,type:b.type||t,name:file.name});
      },t,q)})();
    };
    im.onerror=function(){rej(new Error("Image illisible"))};im.src=u;
  });
}
function blobToB64(b){return new Promise(function(res,rej){var r=new FileReader();r.onload=function(){res(String(r.result).split(",")[1])};r.onerror=rej;r.readAsDataURL(b)})}
function newId(p){var a=new Uint8Array(8);crypto.getRandomValues(a);return p+[].map.call(a,function(x){return x.toString(36).padStart(2,"0")}).join("").slice(0,12)}
function saveMedia(r,name){
  return blobToB64(r.blob).then(function(b64){
    var id=newId("m"),d={name:name||r.name||"image",type:r.type,w:r.w,h:r.h,size:r.blob.size,at:Date.now(),data:b64};
    return api("PUT","c=s_media&id="+id,d).then(function(){var m=Object.assign({},d);delete m.data;S.media.unshift({id:id,d:m});return id});
  });
}
function isFontMedia(m){return m&&m.d&&m.d.type==="font/woff2"}
function imgs(){return S.media.filter(function(m){return !isFontMedia(m)})}
/* police .woff2 : contrôles côté navigateur (extension, taille, signature « wOF2 »), puis le serveur recontrôle tout */
function uploadFont(f){
  return new Promise(function(res,rej){
    if(!/\.woff2$/i.test(f.name)){rej(new Error("Choisissez un fichier .woff2"));return}
    if(f.size>1000000){rej(new Error("Police trop lourde (1 Mo maximum)"));return}
    var r=new FileReader();r.onerror=function(){rej(new Error("Fichier illisible"))};
    r.onload=function(){
      var u=new Uint8Array(r.result);
      if(String.fromCharCode(u[0],u[1],u[2],u[3])!=="wOF2"){rej(new Error("Ce fichier n'est pas une police WOFF2 valide"));return}
      res(saveMedia({blob:new Blob([u],{type:"font/woff2"}),w:0,h:0,type:"font/woff2",name:f.name}));
    };
    r.readAsArrayBuffer(f.slice(0,1000000));
  });
}
function uploadFiles(files){
  var list=[].slice.call(files);var p=Promise.resolve();var ids=[];
  list.forEach(function(f){p=p.then(function(){return imgToBlob(f,1600,false).then(function(r){return saveMedia(r,f.name)}).then(function(id){ids.push(id)})})});
  return p.then(function(){return ids});
}

function editPage(slug){
  var p=S.pages[slug];

  S.edit={slug:slug,p:JSON.parse(JSON.stringify(p))};var E=S.edit.p;

    main(head(esc(E.title),'<a href="#pages">← Toutes les pages</a> · Adresse : <b>/p/'+esc(slug)+'</b>',true)
     +'<div class="card"><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(260px,1fr))"><label class="f">Titre de la page<input type="text" id="pt" value="'+esc(E.title)+'"></label><label class="f">Description (Google et sous le titre)<input type="text" id="pd" value="'+esc(E.desc)+'" maxlength="200"></label></div>'
     +'<div class="row" style="margin-top:.9rem"><label class="row"><input type="checkbox" id="pp"'+(E.published?" checked":"")+'> Page publiée</label><label class="row"><input type="checkbox" id="pn"'+(E.nav?" checked":"")+'> Afficher dans le menu</label><label class="row" style="flex:1;min-width:200px">Nom dans le menu <input type="text" id="pl" value="'+esc(E.navLabel)+'" placeholder="'+esc(E.title)+'" style="max-width:240px"></label><label class="row"><input type="checkbox" id="pi"'+(E.noindex?" checked":"")+'> Masquer de Google</label></div></div>'
     +'<h2>Contenu</h2>'+bl+'<div class="addbar"><span class="hint" style="align-self:center">Ajouter :</span>'+Object.keys(BT).filter(function(k){return!BT[k].home}).map(function(k){return'<button class="btn ghost sm" type="button" data-add="'+k+'">+ '+BT[k].n+'</button>'}).join("")+'</div>');
    $("#savebtn").onclick=save;
    [["pt","title"],["pd","desc"],["pl","navLabel"]].forEach(function(x){$("#"+x[0]).oninput=function(){E[x[1]]=this.value;setDirty(true)}});
    [["pp","published"],["pn","nav"],["pi","noindex"]].forEach(function(x){$("#"+x[0]).onchange=function(){E[x[1]]=this.checked;setDirty(true)}});
    $$("[data-b][data-f]").forEach(function(el){var h=function(){var b=E.blocks[+el.dataset.b];if(el.dataset.i!==undefined)b.items[+el.dataset.i][el.dataset.f]=el.value;else b[el.dataset.f]=el.value;setDirty(true)};el.addEventListener(el.tagName==="SELECT"?"change":"input",h)});
    $$("[data-add]").forEach(function(b){b.onclick=function(){E.blocks.push(BT[b.dataset.add].init());setDirty(true);draw();window.scrollTo(0,document.body.scrollHeight)}});
    $$("[data-mv]").forEach(function(b){b.onclick=function(){var a=b.dataset.mv.split("."),i=+a[0],d=+a[1];var t=E.blocks[i];E.blocks[i]=E.blocks[i+d];E.blocks[i+d]=t;setDirty(true);draw()}});
    $$("[data-dup]").forEach(function(b){b.onclick=function(){var i=+b.dataset.dup;E.blocks.splice(i+1,0,JSON.parse(JSON.stringify(E.blocks[i])));setDirty(true);draw()}});
    $$("[data-rm]").forEach(function(b){b.onclick=function(){if(!confirm("Supprimer ce bloc ?"))return;E.blocks.splice(+b.dataset.rm,1);setDirty(true);draw()}});
    $$("[data-addi]").forEach(function(b){b.onclick=function(){var bk=E.blocks[+b.dataset.addi];if(bk.items.length>=BT[bk.t].max)return;bk.items.push(BT[bk.t].item());setDirty(true);draw()}});
    $$("[data-rmi]").forEach(function(b){b.onclick=function(){var a=b.dataset.rmi.split(".");E.blocks[+a[0]].items.splice(+a[1],1);setDirty(true);draw()}});
    $$("[data-pick]").forEach(function(b){b.onclick=function(){pickMedia(function(id){E.blocks[+b.dataset.pick].media=id;setDirty(true);draw()})}});
    $$("[data-picki]").forEach(function(b){b.onclick=function(){var a=b.dataset.picki.split(".");pickMedia(function(id){E.blocks[+a[0]].items[+a[1]].media=id;setDirty(true);draw()})}});
    setDirty(S.dirty);
  }
  function save(){
    if(!E.title.trim()){toast("Donnez un titre à la page.",true);return}
    E.updated=Date.now();
    api("PUT","c=s_pages&id="+slug,E).then(function(){S.pages[slug]=JSON.parse(JSON.stringify(E));setDirty(false);toast(E.published?"Page enregistrée et publiée.":"Brouillon enregistré.")}).catch(fail);
  }
  draw();
}

var ALPHA="ABCDEFGHJKMNPQRSTUVWXYZ23456789";
function genCode(){var a=new Uint8Array(10),o="";crypto.getRandomValues(a);for(var i=0;i<10;i++){o+=ALPHA[a[i]%ALPHA.length];if(i===4)o+="-"}return o}
function sha(s){return crypto.subtle.digest("SHA-256",new TextEncoder().encode(s)).then(function(b){return Array.prototype.map.call(new Uint8Array(b),function(x){return("0"+x.toString(16)).slice(-2)}).join("")})}
function codeHash(c){return sha("wayle-client:"+String(c).toUpperCase().replace(/[^A-Z0-9]/g,""))}
function newCodeFor(excludeId){
  var c=genCode();return codeHash(c).then(function(h){
    var clash=Object.keys(S.portals).some(function(k){return k!==excludeId&&S.portals[k].codeHash===h});
    return clash?newCodeFor(excludeId):{code:c,hash:h}});
}
function newActivity(id){var p=S.portals[id],a=S.acts[id];if(!a||!a.events)return 0;return a.events.filter(function(e){return e.at>(p.seenAt||0)}).length}
function totalNew(){return Object.keys(S.portals).reduce(function(n,k){return n+newActivity(k)},0)}
function shortDate(){return new Date().toLocaleDateString("fr-FR",{day:"numeric",month:"long",year:"numeric"})}

function showCode(id,name,code,isNew){
  var link="https://wayle.fr/espace-client";
  var msg="Bonjour,\n\nVotre espace client Wayle est prêt : vous y suivez l’avancement du projet, validez les versions et pouvez m’écrire.\n\nLien : "+link+"\nVotre code personnel : "+code+"\n\nÀ bientôt,\nJonas – Wayle Production";
  var d=$("#dlg");
  d.innerHTML='<h2 style="margin-top:0">Code de '+esc(name)+'</h2><div class="warn">Ce code ne sera plus jamais affiché : seule son empreinte est conservée. Copiez-le maintenant. Si vous le perdez, générez-en un nouveau.</div><div class="card" style="text-align:center;font:800 1.8rem ui-monospace,monospace;letter-spacing:.08em">'+esc(code)+'</div><label class="f">Message prêt à envoyer<textarea id="sc-m" readonly style="min-height:11rem">'+esc(msg)+'</textarea></label><div class="row" style="margin-top:1rem;justify-content:flex-end"><button class="btn ghost" id="sc-c" type="button">Copier le message</button><button class="btn" id="sc-ok" type="button">J’ai copié le code</button></div>';
  d.showModal();
  $("#sc-c").onclick=function(){(navigator.clipboard?navigator.clipboard.writeText(msg):Promise.reject()).then(function(){toast("Message copié")}).catch(function(){$("#sc-m").select();toast("Sélectionné : copiez avec Ctrl+C")})};
  $("#sc-ok").onclick=function(){d.close();if(isNew)location.hash="#clients/"+id;else vClients([id])};
}
function listEd(host,arr,fields,mk,addLabel,onChange){
  function draw(){
    host.textContent="";
    arr.forEach(function(it,i){
      var r=document.createElement("div");r.className="item";
      var f=document.createElement("div");f.style.cssText="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:.5rem";
      fields.forEach(function(fd){
        var w=document.createElement("label");w.className="f";w.textContent=fd.l;
        var inp;if(fd.opts){inp=document.createElement("select");fd.opts.forEach(function(o){var op=document.createElement("option");op.value=o[0];op.textContent=o[1];inp.appendChild(op)});inp.value=it[fd.k]||fd.opts[0][0]}
        else if(fd.area){inp=document.createElement("textarea");inp.style.minHeight="3rem";inp.value=it[fd.k]||""}
        else{inp=document.createElement("input");inp.type="text";inp.value=it[fd.k]||""}
        if(fd.max)inp.maxLength=fd.max;if(fd.ph)inp.placeholder=fd.ph;
        inp.addEventListener("input",function(){it[fd.k]=inp.value;onChange()});inp.addEventListener("change",function(){it[fd.k]=inp.value;onChange()});
        w.appendChild(inp);if(fd.area)w.style.gridColumn="1/-1";f.appendChild(w)});
      r.appendChild(f);
      var b=document.createElement("div");b.className="row";
      [["↑",-1],["↓",1]].forEach(function(m){var x=document.createElement("button");x.type="button";x.className="btn ghost sm";x.textContent=m[0];x.setAttribute("aria-label",m[1]<0?"Monter":"Descendre");x.disabled=(i+m[1]<0||i+m[1]>=arr.length);x.onclick=function(){var t=arr[i];arr[i]=arr[i+m[1]];arr[i+m[1]]=t;onChange();draw()};b.appendChild(x)});
      var del=document.createElement("button");del.type="button";del.className="btn danger sm";del.textContent="Supprimer";del.onclick=function(){arr.splice(i,1);onChange();draw()};b.appendChild(del);
      r.appendChild(b);host.appendChild(r);
    });
    var add=document.createElement("button");add.type="button";add.className="btn ghost sm";add.textContent=addLabel;add.onclick=function(){arr.push(mk());onChange();draw()};host.appendChild(add);
  }
  draw();
}
function editClient(id){
  var P=S.portals[id];if(!P){location.hash="#clients";return}
  var A=S.acts[id]||{decisions:{},msgs:[],events:[]};
  P.steps=P.steps||[];P.versions=P.versions||[];P.files=P.files||[];P.invoices=P.invoices||[];P.msgsAdmin=P.msgsAdmin||[];
  var seenOld=P.seenAt||0;
  var thread=[].concat((A.msgs||[]).map(function(m){return{f:"c",t:m.text,at:m.at}}),P.msgsAdmin.map(function(m){return{f:"w",t:m.text,at:m.at}})).sort(function(a,b){return a.at-b.at});
  var evs=(A.events||[]).slice().reverse().slice(0,30);
  main(head(esc(P.name),'<a href="#clients">← Tous les espaces clients</a>',true)
   +'<div class="card"><div class="row" style="align-items:flex-end"><label class="f" style="flex:1;min-width:200px">Nom du client<input type="text" id="e-n" maxlength="120" value="'+esc(P.name)+'"></label><label class="f" style="flex:2;min-width:240px">Projet<input type="text" id="e-p" maxlength="160" value="'+esc(P.project||"")+'"></label></div>'
   +'<div class="row" style="margin-top:.8rem"><button class="btn ghost sm" id="e-code" type="button">Générer un nouveau code</button><button class="btn danger sm" id="e-del" type="button">Supprimer cet espace</button><span class="hint">Le code actuel n’est pas affichable (stocké sous forme d’empreinte). Un nouveau code invalide l’ancien.</span></div></div>'
   +'<h2>Activité du client</h2><div class="card">'+(evs.length?'<ul style="margin:0;padding-left:1.1rem">'+evs.map(function(e){return'<li'+(e.at>seenOld?' style="font-weight:700"':'')+'>'+esc(new Date(e.at).toLocaleString("fr-FR",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"}))+' — '+esc(e.text)+'</li>'}).join("")+'</ul>':'<span class="hint">Rien pour l’instant.</span>')+'</div>'
   +'<h2>Messages</h2><div class="card"><div id="th">'+(thread.length?thread.map(function(m){return'<div style="margin:0 0 .6rem;padding:.5rem .8rem;border-radius:12px;border:1px solid var(--line);background:'+(m.f==="c"?'#2a1c40':'transparent')+'"><span class="hint">'+(m.f==="c"?esc(P.name):"Vous")+' · '+esc(new Date(m.at).toLocaleString("fr-FR",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"}))+'</span><div style="white-space:pre-wrap;overflow-wrap:anywhere">'+esc(m.t)+'</div></div>'}).join(""):'<span class="hint">Aucun message.</span>')+'</div><textarea id="e-r" maxlength="1000" placeholder="Répondre au client…" aria-label="Réponse"></textarea><div class="row" style="margin-top:.5rem"><button class="btn sm" id="e-send" type="button">Envoyer la réponse</button><span class="hint">Le client la verra à sa prochaine visite (pas d’e-mail automatique).</span></div></div>'
   +'<h2>Avancement</h2><div class="card" id="L-steps"></div>'
   +'<h2>Versions à faire valider</h2><div class="card"><p class="hint" style="margin-top:0">Ajoutez le lien de la vidéo (YouTube non répertorié, Vimeo, Drive…). Le client pourra valider ou demander des modifications.</p><div id="L-vers"></div></div>'
   +'<div id="decs"></div>'
   +'<h2>Livrables</h2><div class="card" id="L-files"></div>'
   +'<h2>Factures</h2><div class="card" id="L-inv"></div>');
  var chg=function(){setDirty(true)};
  $("#e-n").oninput=function(){P.name=this.value;chg()};$("#e-p").oninput=function(){P.project=this.value;chg()};
  listEd($("#L-steps"),P.steps,[{k:"label",l:"Étape",max:120},{k:"state",l:"État",opts:[["todo","À venir"],["current","En cours"],["done","Terminé"]]},{k:"date",l:"Date (texte libre)",max:40,ph:"ex. 12 déc."}],function(){return{label:"",state:"todo",date:""}},"+ Ajouter une étape",chg);
  listEd($("#L-vers"),P.versions,[{k:"title",l:"Titre",max:160,ph:"ex. Montage V1"},{k:"date",l:"Date",max:40},{k:"url",l:"Lien (https://…)",max:500},{k:"note",l:"Note pour le client",area:1,max:600}],function(){return{id:"v"+Date.now().toString(36)+Math.random().toString(36).slice(2,4),title:"",url:"",note:"",date:shortDate()}},"+ Ajouter une version",chg);
  listEd($("#L-files"),P.files,[{k:"title",l:"Titre",max:160},{k:"date",l:"Date",max:40},{k:"url",l:"Lien de téléchargement (https://…)",max:500}],function(){return{title:"",date:shortDate(),url:""}},"+ Ajouter un livrable",chg);
  listEd($("#L-inv"),P.invoices,[{k:"label",l:"Libellé",max:160,ph:"ex. Acompte 30 %"},{k:"amount",l:"Montant",max:40,ph:"ex. 165 €"},{k:"state",l:"État",opts:[["sent","Envoyée"],["due","À régler"],["paid","Payée"]]},{k:"url",l:"Lien (https://…)",max:500}],function(){return{label:"",amount:"",state:"sent",url:""}},"+ Ajouter une facture",chg);
  var dec=P.versions.filter(function(v){return A.decisions&&A.decisions[v.id]});
  if(dec.length)$("#decs").innerHTML='<h2>Décisions du client</h2><div class="card">'+dec.map(function(v){var d=A.decisions[v.id];return'<p style="margin:.2rem 0"><b>'+esc(v.title)+'</b> — '+(d.status==="validated"?'<span class="badge on">validée</span>':'<span class="badge mod">modifications demandées</span>')+(d.comment?'<br><span class="hint">« '+esc(d.comment)+' »</span>':'')+'</p>'}).join("")+'<p class="hint">Pour redemander une validation après modification, ajoutez une nouvelle version (V2…).</p></div>';
  function clean(){P.versions=P.versions.filter(function(v){return v.title.trim()});P.steps=P.steps.filter(function(s){return s.label.trim()});P.files=P.files.filter(function(f){return f.title.trim()});P.invoices=P.invoices.filter(function(f){return f.label.trim()})}
  function bad(){var u=[].concat(P.versions,P.files,P.invoices).filter(function(x){return x.url&&!/^https?:\/\//i.test(x.url.trim())});return u.length}
  function persist(msg){clean();if(bad()){toast("Les liens doivent commencer par https://",true);return Promise.reject()}
    P.versions.forEach(function(v){v.url=(v.url||"").trim()});P.files.forEach(function(v){v.url=(v.url||"").trim()});P.invoices.forEach(function(v){v.url=(v.url||"").trim()});
    P.name=P.name.trim()||"Client";P.updated=Date.now();
    return api("PUT","c=c_portal&id="+id,P).then(function(){setDirty(false);if(msg)toast(msg)}).catch(function(e){if(e)fail(e);throw e})}
  $("#savebtn").onclick=function(){persist("Espace client enregistré").then(function(){editClient(id)}).catch(function(){})};
  $("#e-send").onclick=function(){var t=$("#e-r").value.trim();if(!t)return;P.msgsAdmin.push({text:t.slice(0,1000),at:Date.now()});
    persist("Réponse envoyée").then(function(){editClient(id)}).catch(function(){P.msgsAdmin.pop()})};
  $("#e-code").onclick=function(){if(!confirm("Générer un nouveau code ? L’ancien code cessera immédiatement de fonctionner."))return;
    newCodeFor(id).then(function(c){P.codeHash=c.hash;return persist().then(function(){showCode(id,P.name,c.code,false)})}).catch(function(){})};
  $("#e-del").onclick=function(){if(!confirm("Supprimer l’espace de « "+P.name+" » ? Le client perdra l’accès et son historique sera effacé."))return;
    api("DELETE","c=c_portal&id="+id).then(function(){return api("DELETE","c=c_activity&id="+id).catch(function(){})}).then(function(){delete S.portals[id];delete S.acts[id];toast("Espace supprimé");location.hash="#clients"}).catch(fail)};
  /* marque l'activité comme vue */
  if(newActivity(id)){P.seenAt=Date.now();api("PUT","c=c_portal&id="+id,P).catch(function(){})}
}

function homeEdit(){
  var P=S.P,E=JSON.parse(JSON.stringify(S.homeDraft));S.edit={home:E};
  var live=!!S.homeLive,same=live&&JSON.stringify(strip(S.homeLive))===JSON.stringify(strip(E));
  function strip(o){var c=JSON.parse(JSON.stringify(o||{}));delete c.updated;delete c.publishedAt;return c}
  var C=E.cover=E.cover||{},Hh=E.hero=E.hero||{};C.wide=C.wide||[];C.tall=C.tall||[];
  function vrow(g,j){var v=C[g][j];return'<div class="item"><div class="row"><label class="f" style="flex:2">Titre affiché<input type="text" data-cv="'+g+'.'+j+'.t" value="'+esc(v.t)+'"></label><label class="f" style="flex:1">Fichier vidéo<input type="text" data-cv="'+g+'.'+j+'.s" value="'+esc(v.s)+'" placeholder="hero-kaane.mp4"></label><label class="f" style="flex:1">Image d’attente<input type="text" data-cv="'+g+'.'+j+'.p" value="'+esc(v.p)+'" placeholder="hero-kaane-poster.jpg"></label></div><div><button class="btn danger sm" data-cvrm="'+g+'.'+j+'" type="button">Retirer</button></div></div>'}
  function draw(){
    /* garder les parties dépliées et la position de lecture d'un affichage à l'autre */
    var keep={},y=window.scrollY;$$("[id^=hs] details").forEach(function(d){var w=d.closest("[id^=hs]");if(d.open)keep[w.id+"/"+[].indexOf.call(w.querySelectorAll("details"),d)]=1});
    var bl=E.sections.map(function(b,i){var T=BT[b.t]||{n:b.t},home=!!T.home;
      return'<div class="blk'+(b.hidden?' off':'')+'" id="hs'+i+'"><div class="hd"><b>'+(i+1)+'. '+esc(T.n)+(b.hidden?' <span class="badge">masquée</span>':'')+'</b><div class="mini">'
        +'<button type="button" data-mv="'+i+'.-1" aria-label="Monter"'+(i===0?" disabled":"")+'>↑</button><button type="button" data-mv="'+i+'.1" aria-label="Descendre"'+(i===E.sections.length-1?" disabled":"")+'>↓</button>'
        +(home?'<button type="button" data-hide="'+i+'" aria-label="'+(b.hidden?"Afficher":"Masquer")+'" title="'+(b.hidden?"Afficher":"Masquer")+'" style="width:auto;padding:0 .6rem">'+(b.hidden?"Afficher":"Masquer")+'</button>':'<button type="button" data-dup="'+i+'" aria-label="Dupliquer">⧉</button><button type="button" data-rm="'+i+'" aria-label="Supprimer">✕</button>')
        +'</div></div><details class="bd"'+(S.homeOpen===i?" open":"")+' data-open="'+i+'"><summary class="hint">Modifier</summary>'+blockForm(b,i)+'</details></div>'}).join("");
    var gen=Object.keys(BT).filter(function(k){return!BT[k].home});
    main(head(esc(P.n),'<a href="#principales">← Pages principales</a> · État : '+(live?(same?'<span class="badge on">en ligne</span> la version à sections est publiée.':'<span class="badge mod">modifications non publiées</span> le site montre la dernière version publiée.'):'<span class="badge">brouillon</span> le site montre encore la page d’origine.'),true)
     +'<div class="card"><div class="row"><button class="btn" id="hlive" type="button">Modifier en direct</button><a class="btn ghost" id="hprev" target="_blank" rel="noopener" href="'+P.url+'?preview=1">Aperçu du brouillon ↗</a><button class="btn" id="hpub" type="button">Publier sur le site</button>'+(live?'<button class="btn ghost" id="hoff" type="button">Revenir à la page d’origine</button>':'')+'</div><p class="hint" style="margin:.6rem 0 0">« Enregistrer » garde un brouillon. L’aperçu montre le dernier brouillon enregistré. Une fois publiée, cette page se modifie ici : la rubrique « Textes du site » ne s’applique plus à elle.</p></div>'
     +(!P.cover?'':'<h2>Bandeau vidéo</h2><div class="card"><label class="f">Accroche (ligne 1)<input type="text" data-c="pitch1" value="'+esc(C.pitch1)+'"></label><label class="f">Accroche (ligne 2)<input type="text" data-c="pitch2" value="'+esc(C.pitch2)+'"></label><label class="f">Texte de la flèche<input type="text" data-c="cue" value="'+esc(C.cue)+'"></label>'
       +'<details class="sub"><summary>Vidéos sur ordinateur ('+C.wide.length+')</summary>'+C.wide.map(function(v,j){return vrow("wide",j)}).join("")+'<button class="btn ghost sm" data-cvadd="wide" type="button">+ Ajouter une vidéo</button></details>'
       +'<details class="sub"><summary>Vidéos sur téléphone ('+C.tall.length+')</summary>'+C.tall.map(function(v,j){return vrow("tall",j)}).join("")+'<button class="btn ghost sm" data-cvadd="tall" type="button">+ Ajouter une vidéo</button></details>'
       +'<p class="hint">Les vidéos sont des fichiers .mp4 du site (trop lourdes pour l’envoi d’images). Pour en ajouter une nouvelle, déposez-la d’abord dans le dépôt GitHub.</p></div>')
     +'<h2>'+P.hero+'</h2><div class="card"><label class="f">Titre<input type="text" data-h="title" value="'+esc(Hh.title)+'"></label><label class="f">Texte<textarea data-h="text">'+esc(Hh.text)+'</textarea></label><div class="row"><label class="f" style="flex:1">Bouton 1<input type="text" data-h="b1l" value="'+esc(Hh.b1l)+'"></label><label class="f" style="flex:1">Lien<input type="text" data-h="b1u" value="'+esc(Hh.b1u)+'"></label></div><div class="row"><label class="f" style="flex:1">Bouton 2<input type="text" data-h="b2l" value="'+esc(Hh.b2l)+'"></label><label class="f" style="flex:1">Lien<input type="text" data-h="b2u" value="'+esc(Hh.b2u)+'"></label></div></div>'
     +'<h2>Sections</h2><p class="hint">Les sections d’origine peuvent être masquées et déplacées. Les blocs ajoutés peuvent aussi être dupliqués ou supprimés.</p>'+bl
     +'<div class="addbar"><span class="hint" style="align-self:center">Ajouter</span><select id="hpos">'+E.sections.map(function(b,i){return'<option value="'+(i+1)+'"'+(i===E.sections.length-1?" selected":"")+'>après '+(i+1)+'. '+esc((BT[b.t]||{n:b.t}).n)+'</option>'}).join("")+'<option value="0">tout en haut</option></select>'+gen.map(function(k){return'<button class="btn ghost sm" type="button" data-add="'+k+'">+ '+BT[k].n+'</button>'}).join("")+'</div>');
    Object.keys(keep).forEach(function(k){var a=k.split("/"),w=document.getElementById(a[0]),d=w&&w.querySelectorAll("details")[+a[1]];if(d)d.open=true});
    if(y)window.scrollTo(0,y);
    $("#savebtn").onclick=save;
    var ch=function(){setDirty(true)};
    $$("[data-c]").forEach(function(el){el.oninput=function(){C[el.dataset.c]=el.value;ch()}});
    $$("[data-h]").forEach(function(el){el.oninput=function(){Hh[el.dataset.h]=el.value;ch()}});
    $$("[data-cv]").forEach(function(el){el.oninput=function(){var a=el.dataset.cv.split(".");C[a[0]][+a[1]][a[2]]=el.value;ch()}});
    $$("[data-cvadd]").forEach(function(b){b.onclick=function(){C[b.dataset.cvadd].push({s:"",p:"",t:""});ch();draw()}});
    $$("[data-cvrm]").forEach(function(b){b.onclick=function(){var a=b.dataset.cvrm.split(".");C[a[0]].splice(+a[1],1);ch();draw()}});
    $$("details[data-open]").forEach(function(d){d.addEventListener("toggle",function(){if(d.open)S.homeOpen=+d.dataset.open})});
    $$("[data-b][data-f]").forEach(function(el){var h=function(){var b=E.sections[+el.dataset.b];if(el.dataset.i!==undefined)b.items[+el.dataset.i][el.dataset.f]=el.value;else b[el.dataset.f]=el.value;ch()};el.addEventListener(el.tagName==="SELECT"?"change":"input",h)});
    $$("[data-add]").forEach(function(b){b.onclick=function(){var at=+$("#hpos").value;E.sections.splice(at,0,BT[b.dataset.add].init());S.homeOpen=at;ch();draw();var n=$("#hs"+at);if(n)n.scrollIntoView({block:"center"})}});
    $$("[data-mv]").forEach(function(b){b.onclick=function(){var a=b.dataset.mv.split("."),i=+a[0],d=+a[1];var t=E.sections[i];E.sections[i]=E.sections[i+d];E.sections[i+d]=t;S.homeOpen=null;ch();draw();var n=$("#hs"+(i+d));if(n)n.scrollIntoView({block:"center"})}});
    $$("[data-hide]").forEach(function(b){b.onclick=function(){var x=E.sections[+b.dataset.hide];x.hidden=!x.hidden;ch();draw()}});
    $$("[data-dup]").forEach(function(b){b.onclick=function(){var i=+b.dataset.dup;E.sections.splice(i+1,0,JSON.parse(JSON.stringify(E.sections[i])));ch();draw()}});
    $$("[data-rm]").forEach(function(b){b.onclick=function(){if(!confirm("Supprimer ce bloc ?"))return;E.sections.splice(+b.dataset.rm,1);ch();draw()}});
    $$("[data-addi]").forEach(function(b){b.onclick=function(){var bk=E.sections[+b.dataset.addi];bk.items=bk.items||[];if(bk.items.length>=BT[bk.t].max)return;bk.items.push(BT[bk.t].item());ch();draw()}});
    $$("[data-rmi]").forEach(function(b){b.onclick=function(){var a=b.dataset.rmi.split(".");E.sections[+a[0]].items.splice(+a[1],1);ch();draw()}});
    $$("[data-pick]").forEach(function(b){b.onclick=function(){pickMedia(function(id){E.sections[+b.dataset.pick].media=id;ch();draw()})}});
    $$("[data-picki]").forEach(function(b){b.onclick=function(){var a=b.dataset.picki.split(".");pickMedia(function(id){E.sections[+a[0]].items[+a[1]].media=id;ch();draw()})}});
    $$("[data-clr]").forEach(function(b){b.onclick=function(){E.sections[+b.dataset.clr].media="";ch();draw()}});
    $$("[data-clri]").forEach(function(b){b.onclick=function(){var a=b.dataset.clri.split(".");E.sections[+a[0]].items[+a[1]].media="";ch();draw()}});
    $("#hpub").onclick=publish;
    $("#hlive").onclick=function(){if(S.dirty&&!confirm("Des modifications ne sont pas enregistrées ici. Ouvrir le mode direct quand même ?"))return;setDirty(false);startLive("m:"+S.homeKey)};
    $$("[data-p]").forEach(function(el){var a=el.dataset.p.split(":"),h=function(){setP(E.sections[+a[0]],a[1],el.value);ch()};el.addEventListener(el.tagName==="SELECT"?"change":"input",h)});
    $$("[data-padd]").forEach(function(b){b.onclick=function(){var a=b.dataset.padd.split(":"),sec=E.sections[+a[0]],arr=getP(sec,a[1]);if(!arr){setP(sec,a[1],[]);arr=getP(sec,a[1])}arr.push(JSON.parse(b.dataset.tpl));ch();draw()}});
    $$("[data-prm]").forEach(function(b){b.onclick=function(){var a=b.dataset.prm.split(":"),ks=a[1].split("."),j=+ks.pop();getP(E.sections[+a[0]],ks.join(".")).splice(j,1);ch();draw()}});
    $$("[data-ppick]").forEach(function(b){b.onclick=function(){var a=b.dataset.ppick.split(":");pickMedia(function(id){getP(E.sections[+a[0]],a[1]).media=id;ch();draw()})}});
    $$("[data-pclr]").forEach(function(b){b.onclick=function(){var a=b.dataset.pclr.split(":");getP(E.sections[+a[0]],a[1]).media="";ch();draw()}});
    $$("[data-pnone]").forEach(function(b){b.onclick=function(){var a=b.dataset.pnone.split(":"),o=getP(E.sections[+a[0]],a[1]);o.media="";o.img="";ch();draw()}});
    if($("#hoff"))$("#hoff").onclick=function(){if(!confirm("Remettre la page d’origine sur le site ? Votre version à sections reste enregistrée en brouillon."))return;
      api("DELETE","c="+P.coll+"&id="+P.l).then(function(){S.homeLive=null;toast("La page d’origine est de nouveau en ligne.");homeEdit()}).catch(fail)};
    setDirty(S.dirty);
  }
  function save(){E.updated=Date.now();return api("PUT","c="+P.coll+"&id="+P.d,E).then(function(){S.homeDraft=JSON.parse(JSON.stringify(E));setDirty(false);toast("Brouillon enregistré.");homeEdit()}).catch(function(e){fail(e);throw e})}
  function publish(){
    if(!confirm(live?"Publier ces modifications sur la page « "+P.n+" » ?":"Publier la page « "+P.n+" » à sections ? Elle remplacera la page actuelle (vous pourrez revenir en arrière)."))return;
    var p=S.dirty?save():Promise.resolve();
    p.then(function(){var L=JSON.parse(JSON.stringify(S.homeDraft));L.publishedAt=Date.now();return api("PUT","c="+P.coll+"&id="+P.l,L).then(function(){S.homeLive=L;toast("Page publiée. Visible dans quelques secondes.");homeEdit()})}).catch(function(e){if(e)fail(e)});
  }
  draw();
}

/* ---------- Sauvegarde ---------- */
function vBackup(){
  main(head("Sauvegarde","Téléchargez une copie de vos réglages, textes et pages (les images ne sont pas incluses), ou restaurez-la.")
   +'<div class="card"><div class="row"><button class="btn" id="bx" type="button">Télécharger la sauvegarde</button><label class="btn ghost" style="cursor:pointer">Restaurer une sauvegarde<input type="file" id="bi" accept="application/json,.json" hidden></label></div></div>'
   +'<div class="warn">Restaurer remplace les réglages, les textes et les pages actuels par ceux du fichier.</div>');
  $("#bx").onclick=function(){
    var KS=Object.keys(PAGES);
    Promise.all(KS.map(function(k){var P=PAGES[k];return Promise.all([api("GET","c="+P.coll+"&id="+P.d),api("GET","c="+P.coll+"&id="+P.l)]).catch(function(){return[{},{}]})})).then(function(R){
    var hr=R[0],main={};KS.forEach(function(k,n){main[k]={draft:R[n][0].data||null,live:R[n][1].data||null}});
    var o={v:1,at:new Date().toISOString(),config:S.cfg,content:S.content,pages:S.pages,home:{draft:hr[0].data||null,live:hr[1].data||null},main:main};
    var b=new Blob([JSON.stringify(o,null,1)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="wayle-site-sauvegarde-"+new Date().toISOString().slice(0,10)+".json";document.body.appendChild(a);a.click();a.remove();
    });
  };
  $("#bi").onchange=function(e){var f=e.target.files[0];if(!f)return;
    f.text().then(function(t){var o=JSON.parse(t);if(!o||o.v!==1)throw new Error("Fichier non reconnu");
      if(!confirm("Remplacer les réglages, textes et pages actuels par ceux de cette sauvegarde ?"))return;
      var p=api("PUT","c=s_config&id=main",o.config||{}).then(function(){return api("PUT","c=s_content&id=main",o.content||{items:{}})});
      Object.keys(o.pages||{}).forEach(function(k){if(/^[a-z0-9][a-z0-9-]{0,62}$/.test(k))p=p.then(function(){return api("PUT","c=s_pages&id="+k,o.pages[k])})});
      var MP=o.main||(o.home?{accueil:o.home}:null);
      if(MP)Object.keys(MP).forEach(function(k){var P=PAGES[k];if(!P)return;p=p.then(function(){return MP[k].draft?api("PUT","c="+P.coll+"&id="+P.d,MP[k].draft):null}).then(function(){return MP[k].live?api("PUT","c="+P.coll+"&id="+P.l,MP[k].live):api("DELETE","c="+P.coll+"&id="+P.l)})});
      return p.then(loadAll).then(function(){toast("Sauvegarde restaurée");vBackup()});
    }).catch(function(err){toast("Impossible de restaurer : "+(err&&err.message||"fichier invalide"),true)})};
}

/* ---------- démarrage ---------- */
loadAll().then(route).catch(function(e){
  main('<h1>Espace admin</h1><div class="warn">'+(e&&(e.status===401||e.status===403)?"Accès refusé. Ouvrez cette page depuis wayle.fr/admin après vous être connecté avec votre e-mail (code reçu par e-mail).":"Impossible de joindre la base de données ("+esc(e&&e.message||"erreur")+"). Vérifiez que la base D1 est bien liée au projet Pages (nom DB) et que les variables ACCESS_* sont renseignées.")+'</div>');
});
})();
</script>
